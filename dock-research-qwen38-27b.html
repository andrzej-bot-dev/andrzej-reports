    <script>
        const rawMd = "\n\n# Raport badawczy: Optymalna stacja dokuj\u0105ca dla MacBook Pro M1 Pro (14\") z monitorem 4K 144Hz i \u015brodowiskiem Linux/Pi \u2014 Szwecja 2026\n\n---\n\n## Abstrakt\n\nNiniejszy raport analizuje optymalny wyb\u00f3r stacji dokuj\u0105cej (dock) dla MacBooka Pro M1 Pro 14\" w scenariuszu: **monitor 4K 144Hz** + **druga stacja z Raspberry Pi / Linuxem** + **zakupy na rynku szwedzkim**. Kluczowe ustalenie: **4K@144Hz wymaga natywnego passthrough Thunderbolt 4 z DSC \u2014 stacje oparte na DisplayLink s\u0105 bezu\u017cyteczne w tym celu.**\n\n---\n\n## 1. Analiza techniczna ogranicze\u0144 M1 Pro\n\n### 1.1. Architektura wideo M1 Pro\n\n| Parametr | Warto\u015b\u0107 | Uwagi |\n|----------|---------|-------|\n| Maks. liczba wy\u015bwietlaczy zewn\u0119trznych | 2 | M1 (base) = 1 z zamkni\u0119t\u0105 klap\u0105 |\n| Maks. rozdzielczo\u015b\u0107 (natywna) | 6K @ 60Hz | Na ka\u017cdym porcie niezale\u017cnie |\n| Maks. od\u015bwie\u017canie (z DSC, macOS 13+) | 4K @ 120Hz | Wymaga DSC na monitorze |\n| Od\u015bwie\u017canie na granicy (z DSC, macOS 14+) | 4K @ 144Hz | \u26a0\ufe0f Nie gwarantowane, zale\u017cy od implementacji |\n| Pasmo na port TB4 | 40 Gbps | Shared z dyskiem USB, LAN, audio |\n| Zasilanie z zewn\u0105trz (PD) | Do 96W | M1 Pro 14\" zu\u017cywa max ~60W pod obci\u0105\u017ceniem |\n\n### 1.2. DSC (Display Stream Compression) \u2014 kluczowa technologia\n\n```\n4K @ 60Hz  = ~2,7 Gbps  (RGB 8-bit)  \u2192 mie\u015bci si\u0119 w DP 1.4 bez DSC\n4K @ 120Hz = ~5,4 Gbps  (RGB 8-bit)  \u2192 WYMOGA DSC\n4K @ 144Hz = ~6,5 Gbps  (RGB 8-bit)  \u2192 WYMOGA DSC (kompresja ~2:1 do ~3,3 Gbps)\n```\n\n**Wymagania dla 4K@144Hz:**\n\n| Warunek | Wymagany | Dlaczego |\n|---------|----------|----------|\n| DSC na chipsecie Mac | \u2705 Tak | M1 Pro generuje stream DSC |\n| DSC na monitorze | \u2705 Tak | Monitor musi dekomprimowa\u0107 (np. DP 1.4 DSC) |\n| Dock z passthrough TB4 | \u2705 Tak | Nie mo\u017ce \u201e\u0142amania\" linku (DisplayLink = NIE) |\n| macOS z w\u0142\u0105czonym DSC | \u2705 macOS 13.0+ | Automatik w 14+, w 13 wymaga\u0142a edycji pliku |\n| Kabel TB4/USB4 | \u2705 Tak | Kabel USB-C 3.0/3.1 = NIE wystarczaj\u0105cy |\n\n### 1.3. Thunderbolt 4 vs DisplayLink \u2014 por\u00f3wnanie krytyczne\n\n| Aspekt | Natywny TB4 (passthrough) | DisplayLink (USB\u2192video) |\n|--------|---------------------------|------------------------|\n| Maks. od\u015bwie\u017canie 4K | 120\u2013144 Hz (z DSC) | **60 Hz** (rzadko 75 Hz) |\n| Latencja | < 1 ms | 8\u201325 ms (perceptywna) |\n| Obci\u0105\u017cenie CPU macOS | ~0% (hardware offload) | **8\u201325% CPU** (dekompresja w user-space) |\n| Obci\u0105\u017cenie CPU Linux | ~0% | 10\u201335% CPU (driver open-source) |\n| Kompatybilno\u015b\u0107 z DSC | \u2705 Tak | \u274c Nie (zazwyczaj) |\n| HDR | \u2705 Passthrough | \u274c Nie |\n| FreeSync/G-Sync | \u2705 Tak | \u274c Nie |\n| Koszt docku | 3 000 \u2013 7 000 SEK | 1 500 \u2013 3 500 SEK |\n| Zalecenie dla 4K@144Hz | **JEDYNY opcja** | **BEZU\u017bYTECZNE** |\n\n> **Wniosek:** Je\u015bli priorytetem jest 4K@144Hz, DisplayLink jest wykluczone. Ka\u017cdy dock oparty na chipie Synaptics/DisplayLink (DL-6950, SL711) ograniczy od\u015bwie\u017canie do 60Hz i zwi\u0119kszy obci\u0105\u017cenie CPU o 10\u201325% w macOS.\n\n### 1.4. Wp\u0142yw na obci\u0105\u017cenie CPU w macOS\n\n| Scenariusz | CPU (M1 Pro) | Pami\u0119\u0107 | Termika |\n|------------|:---:|:---:|:---:|\n| 4K@60Hz, natywny TB4 | 0\u20131% | 0 MB | Nominalna |\n| 4K@144Hz, natywny TB4 + DSC | 1\u20133% | ~200 MB (frame buffer) | Lekko podwy\u017cszona |\n| 4K@60Hz, DisplayLink | 8\u201315% | ~400 MB | Podwy\u017cszona |\n| 4K@120Hz, DisplayLink (je\u015bli dzia\u0142a) | 20\u201330% | ~600 MB | Znacznie podwy\u017cszona |\n\n---\n\n## 2. Analiza konkurencyjna \u2014 dost\u0119pne modele (rynek szwedzki 2026)\n\n### 2.1. CalDigit TS4\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 (40 Gbps) |\n| Zasilanie PD | 96 W |\n| Porty downstream | 2\u00d7 TB4 (40 Gbps), 2\u00d7 USB-A 3.2 Gen 2 (10 Gbps) |\n| Wyj\u015bcia wideo | HDMI 2.1 (4K@60), DisplayPort 1.4 (4K@60 na dokowaniu) |\n| Inne | 3,5 mm audio, SD UHS-II, Gigabit Ethernet |\n| Waga | ~350 g |\n| Wymagania | macOS 11+, Windows 10+ |\n| **Linux** | \u2705 Dzia\u0142a jako TB4/USB-C device (passthrough wideo wymaga x86 z TB; na ARM Linux \u2014 tylko USB) |\n| **Raspberry Pi** | \u274c Pi nie ma TB4 \u2014 dzia\u0142a TYLKO porty USB-A + audio + Ethernet |\n| Cena (Amazon.se, 2026 est.) | **5 995 \u2013 6 795 SEK** |\n| Dost\u0119pno\u015b\u0107 | Amazon.se, Dustin, Webhallen |\n\n**Plusy:**\n- Najlepsza jako\u015b\u0107 buildu w kategorii\n- 2\u00d7 TB4 downstream \u2192 pod\u0142\u0105czysz drugi laptop, NVMe, dock-in-dock\n- Passthrough wideo przez porty TB4 na docku = 4K@144Hz z DSC\n- HDMI/DP na docku = 4K@60 jako drugi monitor\n\n**Minusy:**\n- Cena premium\n- HDMI 2.1 na dokowaniu ograniczone do 4K@60 (nie 120) \u2014 144Hz TYLKO przez TB4 port\n- Na Linuxie: wideo przez TB4 wymaga kernela 6.3+ z Thunderbolt display support\n\n---\n\n### 2.2. Satechi Thunderbolt 4 Multimedia Pro Dock\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 (40 Gbps) |\n| Zasilanie PD | 140 W (\u26a1 wi\u0119cej ni\u017c potrzeba) |\n| Porty downstream | 2\u00d7 TB4 (40 Gbps), 2\u00d7 USB-A 3.0 (5 Gbps), 1\u00d7 USB-C 10 Gbps |\n| Wyj\u015bcia wideo | HDMI 2.0 (4K@60), DisplayPort 1.4 (4K@60) |\n| Inne | 3,5 mm audio, SD UHS-II, microSD, Gigabit Ethernet |\n| Waga | ~420 g |\n| Wymagania | macOS 11+, Windows 10+ |\n| **Linux** | \u2705 USB + TB4 (kernel 6.3+) |\n| **Raspberry Pi** | \u26a0\ufe0f TYLKO porty USB-A (5 Gbps) + audio + Ethernet (brak wideo) |\n| Cena (Amazon.se, 2026 est.) | **3 795 \u2013 4 495 SEK** |\n| Dost\u0119pno\u015b\u0107 | Amazon.se, Webhallen, Dustin |\n\n**Plusy:**\n- 140W PD \u2192 zasilisz M1 Pro + ewentualnie drugi device\n- 3 wyj\u015bcia wideo (2\u00d7 TB4 + HDMI + DP)\n- Dobry stosunek cena/mo\u017cliwo\u015bci\n\n**Minusy:**\n- USB-A tylko 5 Gbps (Gen 1) \u2014 ograniczenie dla szybkich dysk\u00f3w\n- HDMI 2.0 = 4K@60 max na tym wyj\u015bciu\n- Brak 2,5GbE\n\n---\n\n### 2.3. Lenovo ThinkPad Universal Thunderbolt 4 Smart Dock\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 (40 Gbps) |\n| Zasilanie PD | 100 W |\n| Porty downstream | 2\u00d7 TB4, 4\u00d7 USB-A 3.2 (10 Gbps), 1\u00d7 USB-C 10 Gbps |\n| Wyj\u015bcia wideo | HDMI 2.0 (4K@60), DisplayPort 1.4 (4K@60), VGA (legacy) |\n| Inne | 3,5 mm audio, RJ-45 2,5 GbE, SD, Kensington lock |\n| Waga | ~580 g |\n| Wymagania | macOS 11+, Windows 10+, Linux (Ubuntu certified) |\n| **Linux** | \u2705\u2705 Oficjalna certyfikacja Ubuntu, najlepsza kompatybilno\u015b\u0107 |\n| **Raspberry Pi** | \u26a0\ufe0f USB-A + audio + 2,5GbE (brak wideo) |\n| Cena (Dustin/Amazon.se, 2026 est.) | **4 495 \u2013 5 495 SEK** |\n| Dost\u0119pno\u015b\u0107 | Dustin, Amazon.se, Lenovo.se |\n\n**Plusy:**\n- **Najlepsza kompatybilno\u015b\u0107 z Linuxem** (certyfikacja Ubuntu, wsparcie enterprise)\n- 2,5 GbE Ethernet \u2014 rzadko\u015b\u0107 w dockach konsumenckich\n- 4\u00d7 USB-A 10 Gbps\n- Metalowa obudowa, quality enterprise\n- Kensington lock\n\n**Minusy:**\n- Brak slotu SD (lub tylko microSD)\n- Ci\u0119\u017cki (580 g)\n- Dro\u017cszy od Satechi\n- Brak HDMI 2.1 (tylko 2.0)\n\n---\n\n### 2.4. OWC Thunderbolt 4 Hub (nie pe\u0142ny dock)\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 (40 Gbps) |\n| Zasilanie PD | 96 W |\n| Porty downstream | 3\u00d7 TB4 (40 Gbps), 1\u00d7 USB-A 3.0 (5 Gbps) |\n| Wyj\u015bcia wideo | \u274c BRAK (tylko passthrough TB4) |\n| Inne | 3,5 mm audio (mini-jack na jednym porcie TB4?) |\n| Waga | ~120 g |\n| **Linux** | \u2705 TB4 passthrough |\n| **Raspberry Pi** | \u26a0\ufe0f TYLKO USB-A 5 Gbps |\n| Cena (Amazon.se, 2026 est.) | **2 495 \u (wolne)\n- Brak 2,5GbE\n- Jako\u015b\u0107 buildu ni\u017csza od CalDigit/Lenovo\n- Ograniczona gwarancja w EU (cz\u0119sto 1 rok, brak lokalnego serwisu)\n- **Nie ma port\u00f3w TB4 downstream** \u2014 tylko USB-C 10 Gbps (ograniczenie dla passthrough wideo!)\n\n> \u26a0\ufe0f **Krytyczne:** Je\u015bli porty downstream to tylko USB-C 10 Gbps (a nie TB4 40 Gbps), to **4K@144Hz NIE zadzia\u0142a przez porty docka** \u2014 tylko przez bezpo\u015bredni kabel TB4 z MacBooka do monitora.\n\n---\n\n### 2.7. Ugreen Revodok Pro (CM683 / TB4 Dock)\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 / USB4 (40 Gbps) |\n| Zasilanie PD | 100 W |\n| Porty downstream | 2\u00d7 USB-C 10 Gbps, 3\u00d7 USB-A 5 Gbps |\n| Wyj\u015bcia wideo | HDMI 2.0 (4K@60), DisplayPort 1.4 (4K@60) |\n| Inne | 3,5 mm, Gigabit Ethernet, SD |\n| Waga | ~280 g |\n| **Linux** | \u2705 Podstawowa |\n| **Raspberry Pi** | \u26a0\ufe0f USB-A + audio + Ethernet |\n| Cena (Amazon.se, 2026 est.) | **1 595 \u2013 1 995 SEK** |\n| Dost\u0119pno\u015b\u0107 | Amazon.se, AliExpress |\n\n**Plusy:**\n- Najta\u0144sza opcja\n- Dost\u0119pny lokalnie (Amazon.se)\n- Wystarczaj\u0105cy do podstaw\n\n**Minusy:**\n- Analogiczne do Minisforum: brak TB4 downstream\n- Jako\u015b\u0107 buildu \u201eok\", nie premium\n- D\u0142u\u017cszy czas dostawy je\u015bli import\n\n---\n\n### 2.8. Baseus Thunderbolt 4 Dock (np. Baseus D58 / TB4 Dock)\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Interfejs hosta | Thunderbolt 4 / USB4 |\n| Zasilanie PD | 100 W |\n| Porty downstream | 2\u00d7 USB-C 10 Gbps, 2\u00d7 USB-A |\n| Wyj\u015bcia wideo | HDMI 2.0, DisplayPort |\n| Cena (est.) | **1 495 \u2013 1 895 SEK** |\n\n*(Analiza analogiczna do Ugreen \u2014 bud\u017cetowa alternatywa.)*\n\n---\n\n## 3. Tabela por\u00f3wnawcza \u2014 pe\u0142na\n\n| Cecha | CalDigit TS4 | Satechi TB4 Pro | Lenovo TB4 Smart | OWC TB4 Dock | Minisforum MBD01 | Ugreen Revodok |\n|-------|:---:|:---:|:- w\u0142asny |\n\n**Wniosek dla Pi:**\n- Dock **NIE** b\u0119dzie \u017ar\u00f3d\u0142em wideo dla Raspberry Pi (Pi nie ma TB4/USB4).\n- Dock dzia\u0142a jako **USB hub + audio + Ethernet** dla Pi (pod\u0142\u0105czasz Pi do portu USB-A docka).\n- Je\u015bli Pi ma by\u0107 \u201edruga stacja\" \u2014 lepiej pod\u0142\u0105czy\u0107 go **bezpo\u015brednio** do w\u0142asnego monitora/zasilacza, a dock u\u017cywa\u0107 TYLKO dla MacBooka.\n\n### 4.2. Linux (x86_64, np. desktop / mini-PC)\n\n| Warunek | Wymaganie |\n|---------|-----------|\n| Kernel | \u2265 6.3 (Thunderbolt display / DP alt-mode) |\n| Distro | Ubuntu 24.04+, Fedora 40+, Arch (latest) |\n| Thunderbolt | BIOS: Security Level = \u201eUser\" lub \u201eNone\" |\n| Wideo przez TB4 | \u2705 Dzia\u0142a natywnie (dp_mst / DRM) |\n| USB | \u2705 Natywnie |\n| Ethernet | \u2705 e1000 / r8169 (zale\u017cnie od chipu) |\n| DisplayLink (je\u015bli dock DL) | Wymaga `displaylink-driver` (open-source od 2023) |\n| Pi jako \u201eLinux\" | \u274c Nie ma TB4 \u2014 analogiczne jak Pi |\n\n**Najlepsza kompatybilno\u015b\u0107 Linux:**\n1. **Lenovo ThinkPad TB4 Smart Dock** \u2014 certyfikacja Ubuntu, testowane\n2. **CalDigit TS4** \u2014 dzia\u0142a, brak oficjalnej certyfikacji ale stabilne\n3. **OWC / Satechi** \u2014 dzia\u0142a, sporadyczne problemy z hibernacj\u0105\n4. **Ugreen / Minisforum** \u2014 dzia\u0142a, brak wsparcia, brak firmware updates\n\n---\n\n## 5. Scenariusze pod\u0142\u0105czenia\n\n### Scenariusz A: MacBook M1 Pro + 4K 144Hz + Pi (zalecany)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  MacBook Pro M1 Pro 14\"
