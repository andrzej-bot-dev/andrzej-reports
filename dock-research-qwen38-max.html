    <script>
        const rawMd = "# Stacja dokuj\u0105ca / Hub dla MacBooka M1 Pro + 4K@144Hz + Raspberry Pi \u2014 Raport 2026 (Szwecja)\n\n---\n\n## Spis tre\u015bci\n\n1. [Wyzwania techniczne M1 Pro](#1-wyzwania-techniczne-m1-pro)\n2. [Por\u00f3wnanie stacji dokuj\u0105cych](#2-por\u00f3wnanie-stacji-dokuj\u0105cych)\n3. [Analiza szczeg\u00f3\u0142owa modeli](#3-analiza-szczeg\u00f3\u0142owa-modeli)\n4. [Linux i Raspberry Pi](#4-linux-i-raspberry-pi)\n5. [Ostateczna rekomendacja](#5-ostateczna-rekomendacja)\n\n---\n\n## 1. Wyzwania techniczne M1 Pro\n\n### 1.1 Architektura wy\u015bwietlania\n\n| Parametr | Warto\u015b\u0107 |\n|----------|---------|\n| Chip | Apple M1 Pro (8/10-core CPU, 14/16-core GPU) |\n| Kontroler wy\u015bwietlania | Wbudowany, maks. **2 zewn\u0119trzne wy\u015bwietlacze** |\n| Interfejs | Thunderbolt 4 / USB4 (40 Gbps na port) |\n| DisplayPort | DP 1.4 z DSC 1.2a |\n| Maksymalna przepustowo\u015b\u0107 wideo (1 port TB4) | 32,4 Gbps (HBR3) |\n| Wymagania 4K@144Hz (bez kompresji) | ~28,6 Gbps (8-bit) / ~38,2 Gbps (10-bit) |\n| Wymagania 4K@144Hz (z DSC) | ~12\u201316 Gbps (wsp\u00f3\u0142czynnik kompresji ~2:1 do 3:1) |\n| Wymagania 4K@60Hz (bez kompresji) | ~11,9 Gbps (8-bit) |\n\n### 1.2 Kluczowe wnioski dotycz\u0105ce pasma\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  4K@144Hz BEZ DSC = ~28,6 Gbps \u2192 NIE MIE\u015aCI SI\u0118 w HBR3       \u2502\n\u2502  4K@144Hz Z DSC   = ~12-16 Gbps \u2192 MIE\u015aCI SI\u0118 z zapasem       \u2502\n\u2502  4K@60Hz BEZ DSC  = ~11,9 Gbps  \u2192 MIE\u015aCI SI\u0118 bez problemu     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n**Krytyczna implikacja:** Aby uzyska\u0107 4K@144Hz z M1 Pro, **monitor MUSI wspiera\u0107 DSC 1.2a** (np. LG 27GP950-B, ASUS PG279QM, Dell S2722QC z DSC, Gigabyte M28U). Bez DSC \u2014 fizycznie niemo\u017cliwe przez jeden kabel TB4.\n\n### 1.3 Thunderbolt 4 vs DisplayLink \u2014 fundamentalna r\u00f3\u017cnica\n\n| Cecha | Thunderbolt 4 (natywny) | DisplayLink (USB) |\n|-------|------------------------|-------------------|\n| Maks. rozdzielczo\u015b\u0107 | 4K@144Hz (z DSC) / 5K@60Hz | 4K@60Hz (maks.) |\n| Op\u00f3\u017anienie | < 1 ms | 5\u201315 ms (buforowanie) |\n| Obci\u0105\u017cenie CPU (macOS) | ~0% (sprz\u0119towy encoder) | 8\u201320% CPU (kompresja programowa) |\n| Wsparcie VRR/FreeSync | \u2705 Tak | \u274c Nie |\n| HDR | \u2705 Tak | \u274c Ograniczone |\n| Wymagane sterowniki | Nie (natywne) | Tak (DisplayLink Manager) |\n| Linux | Kernel \u2265 5.6 (natywne) | evdi + DisplayLink driver |\n| Koszt | Wy\u017cszy (dock TB4) | Ni\u017cszy (adapter USB) |\n\n> \u26a0\ufe0f **DisplayLink NIE jest w stanie obs\u0142u\u017cy\u0107 4K@144Hz.** Maksimum to 4K@60Hz. Je\u015bli potrzebujesz 144Hz \u2014 jedyna droga to natywny Thunderbolt 4 z DSC.\n\n### 1.4 Ograniczenia M1 Pro w kontek\u015bcie dock\u00f3w\n\n| Ograniczenie | Wyja\u015bnienie |\n|-------------|-------------|\n| Maks. 2 zewn\u0119trzne wy\u015bwietlacze | Niezale\u017cnie od docka \u2014 limit sprz\u0119towy SoC |\n| Brak eGPU | Nie da si\u0119 rozszerzy\u0107 mo\u017cliwo\u015bci GPU zewn\u0119trznie |\n| TB4 = USB4 na M1 Pro | Pe\u0142na zgodno\u015b\u0107, ale niekt\u00f3re doki USB4 maj\u0105 ograniczenia firmware |\n| Brak TB5 | M1 Pro nie wspiera Thunderbolt 5 (80 Gbps) |\n| PD input | M1 Pro 14\" \u0142aduje si\u0119 maks. 96W (MagSafe) / ~100W USB-C |\n\n---\n\n## 2. Por\u00f3wnanie stacji dokuj\u0105cych\n\n### 2.1 Tabela zbiorcza\n\n| Model | Typ | PD (W) | Porty TB4/USB4 | USB-A | USB-C 10G | LAN | Audio | Cena (SEK, szacunkowa 2026) | Dost\u0119pno\u015b\u0107 SE |\n|-------|-----|--------|----------------|-------|-----------|-----|-------|----------------------------|---------------|\n| **CalDigit TS4** | TB4 | 98W | 3 (1 host + 2 downstream) | 5\u00d7 USB-A 10G | 3\u00d7 USB-C 10G | 2.5 GbE | 3.5mm in/out | ~4 800\u20135 500 | Amazon.se, Dustin |\n| **Satechi TB4 Multimedia Pro** | TB4 | 96W | 3 (1 host + 2 downstream) | 3\u00d7 USB-A 10G | 2\u00d7 USB-C 10G | 2.5 GbE | 3.5mm | ~3 800\u20134 500 | Amazon.se, Inet |\n| **Lenovo ThinkPad TB4 Smart Dock** | TB4 | 100W | 3 (1 host + 2 downstream) | 4\u00d7 USB-A 5G | 2\u00d7 USB-C 10G | 2.5 GbE | 3.5mm combo | ~3 200\u20133 900 | Dustin, Webhallen |\n| **OWC TB4 Dock** | TB4 | 96W | 3 (1 host + 2 downstream) | 4\u00d7 USB-A 10G | 2\u00d7 USB-C 10G | 2.5 GbE | 3.5mm in/out | ~3 500\u20134 200 | Amazon.se |\n| **Ugreen Revodok Pro 13-in-1** | USB4/TB4 | 100W | 2 (1 host + 1 downstream) | 3\u00d7 USB-A 10G | 2\u00d7 USB-C 10G | 2.5 GbE | 3.5mm | ~1 200\u20131 600 | Amazon.se, Inet |\n| **Baseus 8-in-1 USB4** | USB4 | 100W | 1 (host only) | 2\u00d7 USB-A 10G | 1\u00d7 USB-C 10G | 1 GbE | Brak | ~700\u20131 000 | Amazon.se |\n| **Minisforum MBD01** | USB4 | 100W | 2 (1 host + 1 downstream) | 3\u00d7 USB-A 10G | 2\u00d7 USB-C 10G | 2.5 GbE | 3.5mm | ~1 000\u20131 400 | Amazon.se |\n\n### 2.2 Kluczowe r\u00f3\u017cnice \u2014 co wp\u0142ywa na 4K@144Hz\n\n| Model | Output wideo 4K@144Hz | Metoda | Uwagi |\n|-------|----------------------|--------|-------|\n| CalDigit TS4 | \u2705 Port TB4 downstream | Natywny TB4 \u2192 DP 1.4 DSC | Najlepsza kompatybilno\u015b\u0107 |\n| Satechi TB4 Pro | \u2705 Port TB4 downstream | Natywny TB4 \u2192 DP 1.4 DSC | Wymaga kabla TB4 do monitora |\n| Lenovo TB4 Smart | \u2705 Port TB4 downstream | Natywny TB4 \u2192 DP 1.4 DSC | Firmware czasem wymaga aktualizacji |\n| OWC TB4 | \u2705 Port TB4 downstream | Natywny TB4 \u2192 DP 1.4 DSC | Optymalizowany pod macOS |\n| Ugreen Revodok Pro | \u26a0\ufe0f Zale\u017cy od firmware | USB4 \u2192 DP 1.4 DSC | Niekt\u00f3re rev. maj\u0105 problemy z DSC |\n| Baseus 8-in-1 | \u274c Tylko 4K@60Hz | Brak downstream TB4 | Jedyny port wideo = host |\n| Minisforum MBD01 | \u26a0\ufe0f Zale\u017cy od firmware | USB4 \u2192 DP 1.4 DSC | Zg\u0142aszane problemy z macOS |\n\n---\n\n## 3. Analiza szczeg\u00f3\u0142owa modeli\n\n### 3.1 CalDigit TS4 \u2014 \u201eZ\u0142oty standard\"\n\n**Specyfikacja pe\u0142na:**\n\n| Port | Ilo\u015b\u0107 | Pr\u0119dko\u015b\u0107 | Uwagi |\n|------|-------|----------|-------|\n| Thunderbolt 4 (host) | 1 | 40 Gbps | Po\u0142\u0105czenie z MacBookiem |\n| Thunderbolt 4 (downstream) | 2 | 40 Gbps | Monitor / dodatkowe urz\u0105dzenie TB |\n| USB-C (front) | 1 | 10 Gbps | \u0141adowanie urz\u0105dze\u0144 |\n| USB-C (ty\u0142) | 2 | 10 Gbps | Dane |\n| USB-A | 5 | 10 Gbps | Kompatybilno\u015b\u0107 wsteczna |\n| Ethernet | 1 | 2.5 GbE | Realtek RTL8125B |\n| Audio | 2 | 3.5mm | Wej\u015bcie + wyj\u015bcie osobno |\n| SD / microSD | 2 | UHS-II | Jednoczesny dost\u0119p |\n| Zasilanie | \u2014 | 98W PD | Wystarcza dla M1 Pro 14\" |\n\n**Cena w Szwecji (2026):**\n- Amazon.se: ~4 900 SEK\n- Dustin.se: ~5 200 SEK (z VAT)\n- Webhallen: Niedost\u0119pny (CalDigit nie dystrybuuje bezpo\u015brednio)\n\n**Werdykt:**\n- \u2705 Jedyny dock z **3 portami TB4** (1 host + 2 downstream)\n- \u2705 98W PD \u2014 pe\u0142ne \u0142adowanie M1 Pro 14\" pod obci\u0105\u017ceniem\n- \u2705 2.5 GbE \u2014 idealne dla Raspberry Pi (NFS, SSH, Docker)\n- \u2705 SD UHS-II \u2014 szybki transfer z kart Pi\n- \u274c Cena \u2014 najdro\u017cszy w zestawieniu\n- \u274c Brak oficjalnego wsparcia Linux (dzia\u0142a, ale bez gwarancji)\n\n---\n\n### 3.2 Satechi Thunderbolt 4 Multimedia Pro Dock\n\n**Specyfikacja pe\u0142na:**\n\n| Port | Ilo\u015b\u0107 | Pr\u0119dko\u015b\u0107 | Uwagi |\n|------|-------|----------|-------|\n| Thunderbolt 4 (host) | 1 | 40 Gbps | \u2014 |\n| Thunderbolt 4 (downstream) | 2 | 40 Gbps | Monitor / chaining |\n| USB-C (front) | 1 | 10 Gbps | \u2014 |\n| USB-C (ty\u0142) | 1 | 10 Gbps | \u2014 |\n| USB-A | 3 | 10 Gbps | \u2014 |\n| Ethernet | 1 | 2.5 GbE | \u2014 |\n| Audio | 1 | 3.5mm combo | Tylko wyj\u015bcie |\n| SD / microSD | 2 | UHS-I | Wolniejsze ni\u017c CalDigit |\n| Zasilanie | \u2014 | 96W PD | \u2014 |\n\n**Cena w Szwecji (2026):**\n- Amazon.se: ~3 900 SEK\n- Inet.se: ~4 200 SEK\n- Dustin.se: ~4 100 SEK\n\n**Werdykt:**\n- \u2705 \u015awietna relacja cena/jako\u015b\u0107 dla TB4\n- \u2705 2\u00d7 TB4 downstream \u2014 obs\u0142u\u017cy 4K@144Hz\n- \u26a0\ufe0f Tylko 3\u00d7 USB-A (mniej ni\u017c CalDigit)\n- \u26a0\ufe0f SD UHS-I (wolniejsze)\n- \u26a0\ufe0f Brak osobnego wej\u015bcia audio\n\n---\n\n### 3.3 Lenovo ThinkPad Universal Thunderbolt 4 Smart Dock\n\n**Specyfikacja pe\u0142na:**\n\n| Port | Ilo\u015b\u0107 | Pr\u0119dko\u015b\u0107 | Uwagi |\n|------|-------|----------|-------|\n| Thunderbolt 4 (host) | 1 | 40 Gbps | \u2014 |\n| Thunderbolt 4 (downstream) | 2 | 40 Gbps | \u2014 |\n| USB-C | 2 | 10 Gbps | \u2014 |\n| USB-A | 4 | 5 Gbps | \u26a0\ufe0f Wolniejsze ni\u017c konkurencja |\n| Ethernet | 1 | 2.5 GbE | \u2014 |\n| Audio | 1 | 3.5mm combo | \u2014 |\n| Zasilanie | \u2014 | 100W PD | Najwy\u017csze w zestawieniu |\n\n**Cena w Szwecji (2026):**\n- Dustin.se: ~3 400 SEK\n- Webhallen.se: ~3 600 SEK\n- Amazon.se: ~3 200 SEK\n\n**Werdykt:**\n- \u2705 Najta\u0144szy pe\u0142noprawny dock TB4\n- \u2705 100W PD \u2014 przysz\u0142o\u015bciowy\n- \u2705 Dobra dost\u0119pno\u015b\u0107 w Szwecji (Dustin, Webhallen)\n- \u26a0\ufe0f USB-A tylko 5 Gbps (nie 10 Gbps)\n- \u26a0\ufe0f Brak czytnika kart SD\n- \u26a0\ufe0f Firmware zoptymalizowany pod ThinkPady \u2014 na macOS czasem wymaga resetu\n\n---\n\n### 3.4 OWC Thunderbolt 4 Dock\n\n**Specyfikacja pe\u0142na:**\n\n| Port | Ilo\u015b\u0107 | Pr\u0119dko\u015b\u0107 | Uwagi |\n|------|-------|----------|-------|\n| Thunderbolt 4 (host) | 1 | 40 Gbps | \u2014 |\n| Thunderbolt 4 (downstream) | 2 | 40 Gbps | \u2014 |\n| USB-C | 2 | 10 Gbps | \u2014 |\n| USB-A | 4 | 10 Gbps | \u2014 |\n| Ethernet | 1 | 2.5 GbE | \u2014 |\n| Audio | 2 | 3.5mm | In + Out |\n| SD / microSD | 2 | UHS-II | \u2014 |\n| Zasilanie | \u2014 | 96W PD | \u2014 |\n\n**Cena w Szwecji (2026):**\n- Amazon.se: ~3 700 SEK\n- Dustin.se: ~4 000 SEK\n\n**Werdykt:**\n- \u2705 Zaprojektowany z my\u015bl\u0105 o Mac (OWC = Other World Computing)\n- \u2705 Pe\u0142na kompatybilno\u015b\u0107 macOS \u2014 zero problem\u00f3w z firmware\n- \u2705 SD UHS-II\n- \u2705 Audio in + out\n- \u26a0\ufe0f Mniej znany w Szwecji \u2014 serwis mo\u017ce by\u0107 wolniejszy\n\n---\n\n### 3.5 Ugreen Revodok Pro 13-in-1 (USB4)\n\n**Specyfikacja pe\u0142na:**\n\n| Port | Ilo\u015b\u0107 | Pr\u0119dko\u015b\u0107 | Uwagi |\n|------|-------|----------|-------|\n| USB4 (host) | 1 | 40 Gbps | \u2014 |\n| USB4 (downstream) | 1 | 40 Gbps | Tylko 1! |\n| USB-C | 2 | 10 Gbps | \u2014 |\n| USB-A | 3 | 10 Gbps | \u2014 |\n| Ethernet | 1 | 2.5 GbE | \u2014 |\n| Audio | 1 | 3.5mm combo | \u2014 |\n| HDMI | 1 | HDMI 2.1 | \u26a0\ufe0f Osobny port wideo |\n| Zasilanie | \u2014 | 100W PD | \u2014 |\n\n**Cena w Szwecji (2026):**\n- Amazon.se: ~1 300 SEK\n- Inet.se: ~1 500 SEK\n\n**Werdykt:**\n- \u2705 Znakomita cena za USB4 z downstream\n- \u2705 HDMI 2.1 \u2014 alternatywna \u015bcie\u017cka wideo\n- \u26a0\ufe0f **Tylko 1 port downstream** \u2014 je\u015bli pod\u0142\u0105czysz monitor, nie zostaje port na chaining\n- \u26a0\ufe0f Firmware bywa kapry\u015bny z DSC na macOS (zg\u0142aszane migotanie przy 144Hz)\n- \u26a0\ufe0f Brak oficjalnego wsparcia Linux (community reports mieszane)\n\n---\n\n### 3.6 Baseus 8-in-1 USB4 / Minisforum MBD01\n\n**Baseus 8-in-1:**\n\n| Cecha | Warto\u015b\u0107 |\n|-------|---------|\n| Cena | ~800 SEK |\n| TB4/USB4 downstream | \u274c BRAK |\n| Maks. wideo | 4K@60Hz (HDMI 2.0) |\n| PD | 100W pass-through |\n| LAN | 1 GbE |\n| Werdykt | **Unika\u0107 do 4K@144Hz** \u2014 brak downstream TB4 |\n\n**Minisforum MBD01:**\n\n| Cecha | Warto\u015b\u0107 |\n|-------|---------|\n| Cena | ~1 200 SEK |\n| USB4 downstream | 1 port |\n| Maks. wideo | 4K@144Hz (teoretycznie, DSC) |\n| PD | 100W |\n| LAN | 2.5 GbE |\n| Linux | \u26a0\ufe0f Wymaga r\u0119cznej konfiguracji |\n| Werdykt | Ryzykowny \u2014 firmware niedojrza\u0142y, problemy z macOS 15+ |\n\n---\n\n## 4. Linux i Raspberry Pi\n\n### 4.1 Scenariusze u\u017cycia Raspberry Pi z dockiem\n\n| Scenariusz | Wymagania wobec docka | Rekomendacja |\n|-----------|----------------------|--------------|\n| Pi jako headless server (SSH/NFS) | Ethernet 2.5 GbE | Ka\u017cdy dock z 2.5 GbE \u2705 |\n| Pi jako drugi komputer (KVM) | USB-A + Ethernet | CalDigit / Satechi |\n| Pi z pod\u0142\u0105czonym monitorem | Osobny port wideo dla Pi | \u26a0\ufe0f Dock NIE pomo\u017ce \u2014 Pi ma w\u0142asny HDMI |\n| Pi jako NAS / build server | Ethernet + USB (dyski) | CalDigit TS4 (5\u00d7 USB-A) |\n\n### 4.2 Kompatybilno\u015b\u0107 dock\u00f3w z Linux\n\n| Dock | Linux (kernel 6.x) | Uwagi |\n|------|-------------------|-------|\n| CalDigit TS4 | \u2705 Dzia\u0142a (TB4 natywny) | Ethernet Realtek RTL8125B \u2014 sterownik w kernelu od 5.12 |\n| Satechi TB4 Pro | \u2705 Dzia\u0142a | Analogicznie |\n| Lenovo TB4 Smart | \u2705 Dzia\u0142a | Najlepsze wsparcie upstream (Lenovo kontrybuuje do kernela) |\n| OWC TB4 | \u2705 Dzia\u0142a | \u2014 |\n| Ugreen Revodok Pro | \u26a0\ufe0f Cz\u0119\u015bciowo | USB4 dzia\u0142a, ale DSC bywa problematyczny |\n| DisplayLink docks | \u26a0\ufe0f Wymaga evdi | `sudo apt install evdi-dkms` + DisplayLink Manager |\n\n> **Wa\u017cne:** \u017baden dock Thunderbolt 4 nie wymaga sterownik\u00f3w DisplayLink na Linuxie. TB4 jest obs\u0142ugiwane natywnie przez kernel. DisplayLink to osobna technologia (USB \u2192 framebuffer), kt\u00f3ra **obci\u0105\u017ca CPU** i **nie osi\u0105ga 144Hz**.\n\n### 4.3 Konfiguracja Raspberry Pi 5 z dockiem (przez Ethernet)\n\n```bash\n# Na Raspberry Pi 5 (Raspberry Pi OS / Ubuntu 24.04)\n# Po\u0142\u0105czenie przez Ethernet docka (2.5 GbE)\n\n# 1. Ustawienie statycznego IP na Pi\nsudo nano /etc/dhcpcd.conf\n# interface eth0\n# static ip_address=192.168.1.100/24\n# static routers=192.168.1.1\n# static domain_name_servers=192.168.1.1\n\n# 2. NFS mount z Maca (przez dock)\nsudo apt install nfs-common\nsudo mount -t nfs 192.168.1.50:/Users/shared /mnt/mac\n\n# 3. SSH z Maca\nssh pi@192.168.1.100\n```\n\n**Przepustowo\u015b\u0107 2.5 GbE:** ~280 MB/s \u2014 wystarczaj\u0105ce dla NFS, kompilacji, Docker volumes.\n\n---\n\n## 5. Ostateczna rekomendacja\n\n### \ud83c\udfc6 1. Top bez kompromis\u00f3w: CalDigit TS4\n\n| Aspekt | Ocena |\n|--------|-------|\n| 4K@144Hz | \u2705 Perfekcyjnie (2\u00d7 TB4 downstream) |\n| Porty | \u2705 Najwi\u0119cej (18 port\u00f3w) |\n| \u0141adowanie | \u2705 98W |\n| Ethernet | \u2705 2.5 GbE |\n| SD | \u2705 UHS-II |\n| Linux | \u2705 Natywne |\n| Pi integration | \u2705 5\u00d7 USB-A + 2.5 GbE |\n| Cena | \u274c ~5 000 SEK |\n\n**Dla kogo:** Profesjonalista, kt\u00f3ry potrzebuje jednego kabla do wszystkiego i nie chce my\u015ble\u0107 o ograniczeniach.\n\n---\n\n### \ud83d\udcb0 2. Najlepszy stosunek ceny do jako\u015bci: Satechi TB4 Multimedia Pro Dock\n\n| Aspekt | Ocena |\n|--------|-------|\n| 4K@144Hz | \u2705 Perfekcyjnie |\n| Porty | \u2705 Wystarczaj\u0105ce (12 port\u00f3w) |\n| \u0141adowanie | \u2705 96W |\n| Ethernet | \u2705 2.5 GbE |\n| Cena | \u2705 ~3 900 SEK |\n| Linux | \u2705 Natywne |\n\n**Dla kogo:** Kto\u015b, kto chce pe\u0142n\u0105 funkcjonalno\u015b\u0107 TB4 bez przep\u0142acania za 5 port\u00f3w USB-A i UHS-II SD.\n\n**Alternatywa bud\u017cetowa:** Lenovo ThinkPad TB4 Smart Dock (~3 200 SEK) \u2014 je\u015bli nie potrzebujesz SD i akceptujesz USB-A 5 Gbps.\n\n---\n\n### \ud83d\udeab 3. Czego ABSOLUTNIE unika\u0107\n\n| Produkt / Typ | Pow\u00f3d |\n|--------------|-------|\n| **Dowolny dock DisplayLink** (np. Dell D6000, Targus DOCK410) | Maks. 4K@60Hz, obci\u0105\u017ca CPU, brak VRR, brak DSC |\n| **Baseus 8-in-1 USB4** | Brak portu downstream TB4 \u2014 nie da si\u0119 pod\u0142\u0105czy\u0107 monitora 4K@144Hz |\n| **Tanie huby USB-C \u201e12-in-1\" (noname)** | Fa\u0142szywe deklaracje USB4, brak DSC, przegrzewanie |\n| **Docki z HDMI 2.0 jako jedyny output wideo** | HDMI 2.0 = maks. 4K@60Hz. Potrzebujesz HDMI 2.1 lub DP 1.4 |\n| **Minisforum MBD01** | Niedojrza\u0142y firmware, problemy z DSC na macOS 15+, brak wsparcia |\n\n---\n\n## Podsumowanie \u2014 diagram decyzyjny\n\n```\nPotrzebujesz 4K@144Hz?\n\u2502\n\u251c\u2500\u2500 TAK \u2192 Musisz mie\u0107 dock z TB4/USB4 DOWNSTREAM\n\u2502         \u2502\n\u2502         \u251c\u2500\u2500 Bud\u017cet nie gra roli \u2192 CalDigit TS4 (~5 000 SEK)\n\u2502         \u251c\u2500\u2500 Chcesz oszcz\u0119dzi\u0107 \u2192 Satechi TB4 Pro (~3 900 SEK)\n\u2502         \u2514\u2500\u2500 Minimum \u2192 Lenovo TB4 Smart (~3 200 SEK)\n\u2502\n\u2514\u2500\u2500 NIE (wystarczy 4K@60Hz) \u2192 Dowolny dock USB-C z DP Alt Mode\n                               (ale to inny use case ni\u017c w pytaniu)\n\nPotrzebujesz Raspberry Pi?\n\u2502\n\u251c\u2500\u2500 Headless (SSH/NFS) \u2192 Ethernet 2.5 GbE z docka \u2705\n\u251c\u2500\u2500 Z w\u0142asnym monitorem \u2192 Osobny kabel HDMI z Pi, dock nie pomaga\n\u2514\u2500\u2500 Jako storage node \u2192 USB-A z docka + Ethernet\n```\n\n---\n\n*Opracowanie: stycze\u0144 2026. Ceny orientacyjne na podstawie Amazon.se, Dustin.se, Inet.se, Webhallen.se. Dost\u0119pno\u015b\u0107 i ceny mog\u0105 si\u0119 r\u00f3\u017cni\u0107. Zawsze weryfikuj, czy monitor wspiera DSC 1.2a przed zakupem.*";
